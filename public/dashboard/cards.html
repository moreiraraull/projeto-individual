<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoiseForge | Tempo Real</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao(), buscarRepertorioPorUsuario()">

    <div class="janela">

        <div class="header-left dash-header">

            <h1>Dashboard:</h1>

            <div class="btn-nav">
                <img src="../assets/icon/musicas.svg" class="icon">
                <h3>Músicas Cadastradas</h3>
            </div>

            
                <a href="./dashboard.html" class="btn-nav-white">
                    <img src="../assets/icon/chart.svg" class="icon">
                    <h3>Gráficos de navegação</h3>
                </a>

                <div class="profile">
                    <div class="info">
                        <img src="../assets/icon/profile.svg" class="icon">
                                        <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
                    </div>
                <!-- Botão de sair -->
                <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
                </div>
            </div>

            

        </div>

        <div class="dash">
            <h1 class="titulo-dash">Suas músicas:</h1>
        
            <div class="cards" id="cardRepertorio">
                <!-- Os cards das músicas são criados pelo JavaScript (função buscarRepertorioPorUsuario) -->
            </div>
                    <a href="pesquisa.html" class="btn-adicionar">
                        <img src="../assets/icon/plus.svg" class="icon">
                        Adicionar Música
                    </a>
            </div>

        </div>

    </div>

</body>

<script>

    function buscarRepertorioPorUsuario() {
    // Pega o ID do usuário logado
    var idUsuario = sessionStorage.ID_USUARIO;

    // Faz a requisição para a sua rota do Express (ajuste o caminho conforme o seu arquivo em src/routes/)
    fetch(`/repertorio/${idUsuario}`, {
        method: "GET",
        headers: {
            "Content-Type": "application/json"
        }
    })
    .then(function (resposta) {
        if (resposta.ok) {
            // Se não houver músicas cadastradas (status 204), avisa na tela
            if (resposta.status == 204) {
                document.getElementById("cardRepertorio").innerHTML = "<p>Nenhuma música cadastrada no seu repertório ainda.</p>";
                throw "Nenhum resultado encontrado!";
            }

            resposta.json().then(function (repertorio) {
                console.log("Dados recebidos: ", JSON.stringify(repertorio));

                var container = document.getElementById("cardRepertorio");
                container.innerHTML = ""; // Limpa os cards antigos antes de renderizar

                repertorio.forEach(item => {

                    // Transforma o número do progresso (1, 2 ou 3) em texto
                    // e define a classe que muda a cor da etiqueta (está no dashboards.css)
                    var textoProgresso = "";
                    var classeProgresso = "";
                    if (item.progresso == 1) {
                        textoProgresso = "Para aprender";
                        classeProgresso = "nivel-1";
                    } else if (item.progresso == 2) {
                        textoProgresso = "Aprendendo";
                        classeProgresso = "nivel-2";
                    } else {
                        textoProgresso = "Dominada";
                        classeProgresso = "nivel-3";
                    }

                    // O botão só aparece se a música ainda não estiver dominada
                    var botaoAvancar = "";
                    if (item.progresso < 3) {
                        botaoAvancar = `<button class="btn-musica" onclick="avancarNivel(${item.id})">Avançar nível</button>`;
                    }

                    container.innerHTML += `
                        <div class="card-musica">
                            <div class="capa-musica">
                                <img src="${item.capa_url}" alt="Capa da música" id="capa_musica_${item.id}">
                            </div>
                            <div class="info-musica">
                                <div class="title-musica">
                                    <h1>${item.titulo}</h1>
                                    <h2>${item.artista}</h2>
                                    <h3>${item.album}</h3>
                                </div>
                                <div class="etiquetas-musica">
                                    <span>${item.instrumento}</span>
                                    <span class="${classeProgresso}">${textoProgresso}</span>
                                </div>
                                ${botaoAvancar}
                            </div>
                        </div>
                    `;
                });
            });
        } else {
            throw "Houve um erro na API ao buscar o repertório!";
        }
    })
    .catch(function (erro) {
        console.error(erro);
    });
}

    // Avança o nível de progresso da música (Para aprender -> Aprendendo -> Dominada)
    function avancarNivel(idRepertorio) {
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/repertorio/avancar/${idRepertorio}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuario: idUsuario
            })
        })
        .then(function (resposta) {
            if (resposta.ok) {
                // Busca o repertório de novo para redesenhar os cards já atualizados
                buscarRepertorioPorUsuario();
            } else {
                resposta.text().then(function (texto) {
                    console.error(texto);
                });
            }
        })
        .catch(function (erro) {
            console.error(erro);
        });
    }

</script>

</html>
