<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoiseForge | Tempo Real</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao(), buscarRepertorioPorUsuario(),  atualizacaoPeriodica()">

    <div class="janela">

        <div class="header-left dash-header">

            <h1>Dashboard:</h1>

            <div class="btn-nav">
                <img src="../assets/icon/musicas.svg" class="icon">
                <h3>Músicas Cadastradas</h3>
            </div>

            
                <a href="./dashboard.html" class="btn-nav-white">
                    <img src="../assets/icon/chart.svg" class="icon">
                    <h3>Gráficos de navegação</h3>
                </a>

                <div class="profile">
                    <div class="info">
                        <img src="../assets/icon/profile.svg" class="icon">
                                        <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
                    </div>
                <!-- Botão de sair -->
                <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
                </div>
            </div>

            

        </div>

        <div class="dash">
            <div id="alerta">
            </div>
        
            <div class="cards" id="cardRepertorio">
                <!-- Placeholder do card -->
                <div class="card-musica">
                        <div class="capa-musica">
                            <!-- o src vai pesquisar a capa pela url armazenada no banco de dados -->
                            <img src="${item.capa_url}" alt="Capa da música" id="capa_musica_${item.id}">
                        </div>
                        <div class="info-musica">
                            <div class="title-musica">
                                <h1>${item.musica}</h1>
                                <h2>${item.artista}</h2>
                            </div>
                            <div class="etiquetas-musica">
                                <span>${item.instrumento}</span>
                                <span>${item.progresso}</span>
                            </div>
                                                <!-- Botão para aumentar o progresso -->
                         <button class="btn-musica" id="progresso">Avançar para próximo nivel</button>
                        </div>
                        
                    </div>
                    </div>
            </div>

        </div>

    </div>

</body>

<script>

    function buscarRepertorioPorUsuario() {
        JSON.parse(sessionStorage.REPERTORIO).forEach(item => {
            document.getElementById("cardRepertorio").innerHTML += `
                    <div class="card-musica">
                        <div class="capa-musica">
                            <!-- o src vai pesquisar a capa pela url armazenada no banco de dados -->
                            <img src="${item.capa_url}" alt="Capa da música" id="capa_musica_${item.id}">
                        </div>
                        <div class="info-musica">
                            <div class="title-musica">
                                <h1>${item.musica}</h1>
                                <h2>${item.artista}</h2>
                            </div>
                            <div class="etiquetas-musica">
                                <span>${item.instrumento}</span>
                                <span>${item.progresso}</span>
                            </div>
                                                <!-- Botão para aumentar o progresso -->
                         <button class="btn-musica" id="progresso">Avançar para próximo nivel</button>
                        </div>
                        
                    </div>
                    `
        });
    }

</script>

</html>
