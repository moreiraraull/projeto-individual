<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoiseForge | Adicionar Música</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao()" style="background-color: #161618;">

    <div class="janela">


        <div class="header-left dash-header">

            <h1>Dashboard:</h1>

            <div class="btn-nav">
                <img src="../assets/icon/musicas.svg" class="icon">
                <h3>Músicas Cadastradas</h3>
            </div>

            
                <a href="./dashboard.html" class="btn-nav-white">
                    <img src="../assets/icon/chart.svg" class="icon">
                    <h3>Gráficos de navegação</h3>
                </a>

                <div class="profile">
                    <div class="info">
                        <img src="../assets/icon/profile.svg" class="icon">
                                        <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
                    </div>
                <!-- Botão de sair -->
                <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
                </div>
            </div>

            

        </div>

        <div class="dash-right">
            <div class="avisos">
                <div id="alerta">
                </div>
                <div class="container">
                    <h1>Cadastrar nova música</h1>
                    <div class="div-form">
                        <form id="form_postagem">
                            <div class="container-busca">
                                <label for="ipt_busca">
                                    Insira o nome da música:
                                    <br>
                                    <input name="ipt_busca" id="ipt_busca" maxlength="100" type="text">
                                </label>
                                <button onclick="buscarMusica()" type="button">Buscar</button>
                                <div id="div_resultados"></div>
                            </div>
                            <br>
                            <br>
                            <!-- Os inputs exibem os dados da música para o usuário -->
                        <input hidden type="text" id="ipt_id_spotify" disabled >
                        <input hidden type="text" id="ipt_titulo_musica" disabled >
                        <input hidden type="text" id="ipt_artista_musica" disabled >
                        <input hidden type="text" id="ipt_capa_musica" disabled >
                        <input hidden type="text" id="ipt_nome_album" disabled >

                        <label style="color: #F5F5F5;">Música selecionada: <span id="span_musica_selecionada" style="color: #D62872;">Nenhuma</span></label>
                        <br><br>
                        <label for="slct_instrumento">Selecione em qual instrumento você vai aprender a música</label>
                            <select name="slct_instrumento" id="slct_instrumento">
                                <option>Guitarra</option>
                                <option>Baixo</option>
                                <option>Violão</option>
                                <option>Piano</option>
                                <option>Canto</option>
                            </select> <br>
                            <label for="slct_progresso">Selecione qual seu nível de progresso com a música</label>
                            <select name="slct_progresso" id="slct_progresso">
                                <option value="1">Ainda não sei</option>
                                <option value="2">Estou aprendendo</option>
                                <option value="3">Já sei tocar</option>
                            </select> <br>
                            <button onclick="cadastrar()" type="button">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>




</body>

</html>

<script>
    
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function limparFormulario() {
        document.getElementById("form_postagem").reset();
    }
    // Busca a música no Spotify e exibe os resultados na tela
    function buscarMusica() {
        var termo = ipt_busca.value;
        var div_resultados = document.getElementById("div_resultados");
        
        if (termo == "") {
            alert("Digite o nome de uma música!");
        }

        div_resultados.innerHTML = "Procurando músicas...";

        fetch("/spotify/pesquisar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ termo: termo }) // Envia a busca do input no corpo da requisição
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (dados) {
                    div_resultados.innerHTML = ""; 
                    var musicas = dados.tracks.items;

                    // enquanto houver músicas, vai preenchendo os cards
                    for (var i = 0; i < musicas.length; i++) {
                        var musica = musicas[i];
                        div_resultados.innerHTML += `
                            <div onclick="selecionarMusica('${musica.id}', '${musica.name}', '${musica.artists[0].name}', '${musica.album.images[0].url}', '${musica.album.name}')" 
                                 style="border-bottom: 1px solid #333; padding: 10px 0; cursor: pointer; display: flex; gap: 10px;">
                                <img src="${musica.album.images[0].url}" width="50">
                                <div>
                                    <strong>${musica.name}</strong><br>
                                    <small>${musica.artists[0].name}</small> <br>
                                    <small>${musica.album.name}</small>
                                </div>
                            </div>
                        `;
                    }
                });
            }
        });
    }

    // Pega os dados da música que o usuário selecionou e coloca nos inputs
    function selecionarMusica(id, titulo, artista, capa, album) {
        document.getElementById("ipt_id_spotify").value = id;
        document.getElementById("ipt_titulo_musica").value = titulo;
        document.getElementById("ipt_artista_musica").value = artista;
        document.getElementById("ipt_capa_musica").value = capa;
        document.getElementById("ipt_nome_album").value = album;
        document.getElementById("span_musica_selecionada").innerHTML = `${titulo} - ${artista}`;
    }

    function cadastrar() {
        var idUsuario = sessionStorage.ID_USUARIO;
        var idSpotify = document.getElementById("ipt_id_spotify").value;
        var titulo = document.getElementById("ipt_titulo_musica").value;
        var artista = document.getElementById("ipt_artista_musica").value;
        var urlCapa = document.getElementById("ipt_capa_musica").value;
        var instrumento = document.getElementById("slct_instrumento").value;
        var progresso = document.getElementById("slct_progresso").value;
        var album = document.getElementById("ipt_nome_album").value;

        if (idSpotify == "") {
            alert("Por favor, pesquise e selecione uma música do Spotify primeiro!");
            return;
        }

        fetch("/repertorio/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                idUsuario,
                idSpotify,
                titulo,
                artista,
                urlCapa,
                instrumento,
                progresso,
                album
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                alert("Música adicionada ao seu repertório com sucesso!");
                window.location = "cards.html"; // Redireciona para as músicas
            } else {
                alert("Erro ao cadastrar música.");
            }
        });
    }
        
    function publicar() {
        var idUsuario = sessionStorage.ID_USUARIO;

        var corpo = {
            titulo: form_postagem.titulo.value,
            descricao: form_postagem.descricao.value
        }

        fetch(`/avisos/publicar/${idUsuario}`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(corpo)
        }).then(function (resposta) {

            console.log("resposta: ", resposta);

            if (resposta.ok) {
                window.alert("Post realizado com sucesso pelo usuario de ID: " + idUsuario + "!");
                window.location = "/dashboard/mural.html";
                limparFormulario();
                finalizarAguardar();
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            finalizarAguardar();
        });

        return false;

    }

    function editar(idAviso) {
        sessionStorage.ID_POSTAGEM_EDITANDO = idAviso;
        console.log("cliquei em editar - " + idAviso);
        window.alert("Você será redirecionado à página de edição do aviso de id número: " + idAviso);
        window.location = "/dashboard/edicao-aviso.html"

    }

    function deletar(idAviso) {
        console.log("Criar função de apagar post escolhido - ID" + idAviso);
        fetch(`/avisos/deletar/${idAviso}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(function (resposta) {

            if (resposta.ok) {
                window.alert("Post deletado com sucesso pelo usuario de email: " + sessionStorage.getItem("EMAIL_USUARIO") + "!");
                window.location = "/dashboard/mural.html"
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });
    }

    function atualizarFeed() {
        fetch("/avisos/listar").then(function (resposta) {
            if (resposta.ok) {
                if (resposta.status == 204) {
                    var feed = document.getElementById("feed_container");
                    var mensagem = document.createElement("span");
                    mensagem.innerHTML = "Nenhum resultado encontrado."
                    feed.appendChild(mensagem);
                    throw "Nenhum resultado encontrado!!";
                }

                resposta.json().then(function (resposta) {
                    console.log("Dados recebidos: ", JSON.stringify(resposta));

                    var feed = document.getElementById("feed_container");
                    feed.innerHTML = "";
                    for (let i = 0; i < resposta.length; i++) {
                        var publicacao = resposta[i];

                        // criando e manipulando elementos do HTML via JavaScript
                        var divPublicacao = document.createElement("div");
                        var spanID = document.createElement("span");
                        var spanTitulo = document.createElement("span");
                        var spanNome = document.createElement("span");
                        var divDescricao = document.createElement("div");
                        var divButtons = document.createElement("div");
                        var btnEditar = document.createElement("button");
                        var btnDeletar = document.createElement("button");


                        spanID.innerHTML = "ID: <b>" + publicacao.idAviso + "</b>";
                        spanTitulo.innerHTML = "Título: <b>" + publicacao.titulo + "</b>";
                        spanNome.innerHTML = "Autor: <b>" + publicacao.nome + "</b>";
                        divDescricao.innerHTML = "Descrição: <b>" + publicacao.descricao + "</b>";
                        btnEditar.innerHTML = "Editar";
                        btnDeletar.innerHTML = "Deletar";

                        divPublicacao.className = "publicacao";
                        spanTitulo.id = "inputNumero" + publicacao.idAviso;
                        spanNome.className = "publicacao-nome";
                        spanTitulo.className = "publicacao-titulo";
                        divDescricao.className = "publicacao-descricao";

                        divButtons.className = "div-buttons"

                        btnEditar.className = "publicacao-btn-editar"
                        btnEditar.id = "btnEditar" + publicacao.idAviso;
                        btnEditar.setAttribute("onclick", `editar(${publicacao.idAviso})`);

                        btnDeletar.className = "publicacao-btn-editar"
                        btnDeletar.id = "btnDeletar" + publicacao.idAviso;
                        btnDeletar.setAttribute("onclick", `deletar(${publicacao.idAviso})`);

                        divPublicacao.appendChild(spanID);
                        divPublicacao.appendChild(spanNome);
                        divPublicacao.appendChild(spanTitulo);
                        divPublicacao.appendChild(divDescricao);
                        divPublicacao.appendChild(divButtons);
                        divButtons.appendChild(btnEditar);
                        divButtons.appendChild(btnDeletar);
                        feed.appendChild(divPublicacao);
                    }

                    finalizarAguardar();
                });
            } else {
                throw ('Houve um erro na API!');
            }
        }).catch(function (resposta) {
            console.error(resposta);
            finalizarAguardar();
        });
    }

</script>
